<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#263238"/>
  
  <!-- Cat face base -->
  <ellipse cx="256" cy="260" rx="120" ry="100" fill="#F5A623"/>
  
  <!-- Ears -->
  <path d="M150 180 L130 100 L170 150 Z" fill="#F5A623"/>
  <path d="M362 180 L382 100 L342 150 Z" fill="#F5A623"/>
  <path d="M154 170 L138 115 L166 145 Z" fill="#FFAB91"/>
  <path d="M358 170 L378 115 L350 145 Z" fill="#FFAB91"/>
  
  <!-- Forehead stripes (M pattern) -->
  <path d="M220 160 L215 210" stroke="#6D4C21" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M256 158 L256 215" stroke="#6D4C21" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M292 160 L297 210" stroke="#6D4C21" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- White muzzle -->
  <ellipse cx="256" cy="310" rx="55" ry="35" fill="#FFF8E1"/>
  
  <!-- Eyes -->
  <ellipse cx="216" cy="250" rx="18" ry="22" fill="#FFFFFF"/>
  <ellipse cx="296" cy="250" rx="18" ry="22" fill="#FFFFFF"/>
  <circle cx="218" cy="250" r="10" fill="#2E2E2E"/>
  <circle cx="298" cy="250" r="10" fill="#2E2E2E"/>
  <circle cx="214" cy="246" r="4" fill="#FFFFFF"/>
  <circle cx="294" cy="246" r="4" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <path d="M256 290 L248 305 L264 305 Z" fill="#F48FB1"/>
  
  <!-- Mouth -->
  <path d="M256 305 L246 315 M256 305 L266 315" stroke="#4E342E" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Whiskers -->
  <g stroke="#78909C" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M190 305 L150 295"/>
    <path d="M190 310 L148 310"/>
    <path d="M190 315 L150 325"/>
    <path d="M322 305 L362 295"/>
    <path d="M322 310 L364 310"/>
    <path d="M322 315 L362 325"/>
  </g>
  
  <!-- Cheek stripes -->
  <circle cx="185" cy="300" r="3" fill="#6D4C21" opacity="0.7"/>
  <circle cx="327" cy="300" r="3" fill="#6D4C21" opacity="0.7"/>
  
  <!-- Tail tip visible at bottom -->
  <circle cx="380" cy="410" r="8" fill="#5D4037"/>
</svg>